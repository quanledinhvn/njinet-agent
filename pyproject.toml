[project]
name = "njinet-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "quanle", email = "quan.ledinhvn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arq>=0.28.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg>=3.3.4",
    "pydantic-settings>=2.14.2",
    "redis>=5.3.1",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
njinet-agent = "njinet_agent:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.ruff.lint]
select = ["E", "F", "ASYNC", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
